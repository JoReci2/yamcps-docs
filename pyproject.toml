[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamcps-docs"
version = "0.1.0"
description = "Local document retrieval connector for yamcps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["yamcps>=0.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff", "mypy", "build", "hatchling", "editables", "coverage", "bandit", "radon"]
formats = ["pypdf>=5,<7", "python-docx>=1,<2"]

[project.scripts]
yamcps-docs = "yamcps_docs.cli:main"

[project.entry-points."yamcps.connectors"]
docs = "yamcps_docs:DocsConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/yamcps_docs"]

[project.urls]
Repository = "https://github.com/JoReci2/yamcps-docs"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/contributing.md", "/MIGRATION.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
