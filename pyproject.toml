[build-system]
requires = ["hatchling", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "yamcps-docs"
dynamic = ["version"]
description = "Local document retrieval connector for yamcps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["yamcps>=0.3.0,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff", "mypy", "build", "hatchling", "hatch-vcs>=0.4,<1", "editables", "coverage", "bandit", "radon"]
pdf = ["pypdf>=5,<7"]
words = ["python-docx>=1,<2"]
excel = ["openpyxl>=3.1,<4", "xlrd>=2,<3"]
powerpoint = ["python-pptx>=1,<2"]
all = ["pypdf>=5,<7", "python-docx>=1,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3", "python-pptx>=1,<2"]

[project.scripts]
yamcps-docs = "yamcps_docs.cli:main"

[project.entry-points."yamcps.connectors"]
docs = "yamcps_docs:DocsConnector"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.targets.wheel]
packages = ["src/yamcps_docs"]

[project.urls]
Repository = "https://github.com/JoReci2/yamcps-docs"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/contributing.md", "/LICENSE", "/pyproject.toml", "/.github/workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
